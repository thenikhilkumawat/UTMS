<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>आज का हिसाब — उत्तम टेलर्स</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
  padding: 16px;
}
.header {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.header .date { font-size: 14px; opacity: 0.85; }
.header .time { font-size: 12px; opacity: 0.7; margin-top: 2px; }

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Money cards */
.money-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.money-box {
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
}
.money-box .label { font-size: 12px; font-weight: 700; opacity: 0.75; margin-bottom: 6px; }
.money-box .amount { font-size: 26px; font-weight: 900; }

.box-cash   { background: #f0fdf4; color: #166534; }
.box-upi    { background: #eff6ff; color: #1e40af; }
.box-total  { background: #faf5ff; color: #6b21a8; }
.box-expense{ background: #fff1f2; color: #9f1239; }

.total-card {
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  text-align: center;
}
.total-card .label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
.total-card .amount { font-size: 36px; font-weight: 900; }

/* Orders */
.order-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f1f5f9;
  gap: 12px;
}
.order-row:last-child { border-bottom: none; }
.order-num {
  background: #eef2ff;
  color: #4338ca;
  font-size: 13px;
  font-weight: 900;
  padding: 4px 8px;
  border-radius: 8px;
  min-width: 52px;
  text-align: center;
}
.order-info { flex: 1; }
.order-name { font-size: 15px; font-weight: 700; color: #1e293b; }
.order-garments { font-size: 12px; color: #64748b; margin-top: 1px; }
.order-status {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 20px;
}
.status-pending  { background: #fef3c7; color: #92400e; }
.status-ready    { background: #d1fae5; color: #065f46; }
.status-delivered{ background: #e0e7ff; color: #3730a3; }

.expense-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 15px;
}
.expense-row:last-child { border-bottom: none; }
.expense-name { color: #374151; font-weight: 600; }
.expense-amt  { color: #dc2626; font-weight: 800; }

.empty { text-align: center; color: #94a3b8; padding: 20px; font-size: 14px; }

.refresh-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #6366f1;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
  text-align: center;
}

.net-box {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #f8fafc;
  border-radius: 12px;
  margin-top: 10px;
}
.net-box .net-label { font-size: 13px; font-weight: 700; color: #64748b; }
.net-box .net-val   { font-size: 20px; font-weight: 900; }
.net-positive { color: #059669; }
.net-negative { color: #dc2626; }
</style>
</head>
<body>

<div class="header">
  <h1>🏪 उत्तम टेलर्स</h1>
  <div class="date" id="today-date"></div>
  <div class="time" id="now-time"></div>
</div>

<!-- Money Summary -->
<div class="total-card">
  <div class="label">💰 आज कुल आमदनी</div>
  <div class="amount">₹<span id="total-income">—</span></div>
</div>

<div class="money-grid">
  <div class="money-box box-cash">
    <div class="label">💵 नकद</div>
    <div class="amount">₹<span id="cash-in">—</span></div>
  </div>
  <div class="money-box box-upi">
    <div class="label">📱 UPI/बैंक</div>
    <div class="amount">₹<span id="upi-in">—</span></div>
  </div>
</div>

<!-- Expense -->
<div class="card">
  <div class="card-title" style="color:#dc2626;">💸 आज का खर्चा</div>
  <div id="expense-list"><div class="empty">कोई खर्चा नहीं</div></div>
  <div class="net-box" id="net-box" style="display:none">
    <span class="net-label">बचत (आमदनी − खर्चा)</span>
    <span class="net-val" id="net-val">—</span>
  </div>
</div>

<!-- Today's Orders -->
<div class="card">
  <div class="card-title" style="color:#6366f1;">📋 आज के ऑर्डर
    <span style="background:#eef2ff;color:#4338ca;border-radius:20px;padding:2px 10px;font-size:12px;" id="order-count">—</span>
  </div>
  <div id="order-list"><div class="empty">लोड हो रहा है...</div></div>
</div>

<!-- Delivered today -->
<div class="card">
  <div class="card-title" style="color:#059669;">✅ आज डिलीवर हुए
    <span style="background:#d1fae5;color:#065f46;border-radius:20px;padding:2px 10px;font-size:12px;" id="del-count">—</span>
  </div>
  <div id="del-list"><div class="empty">लोड हो रहा है...</div></div>
</div>

<button class="refresh-btn" onclick="loadData()">🔄 ताज़ा करें (Refresh)</button>

<script>
function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }

function setDate() {
  var now = new Date();
  var days = ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
  var months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
  document.getElementById('today-date').textContent =
    days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
  var h = now.getHours(), m = now.getMinutes();
  var ampm = h >= 12 ? 'शाम' : 'सुबह';
  h = h % 12 || 12;
  document.getElementById('now-time').textContent = ampm + ' ' + h + ':' + (m<10?'0'+m:m) + ' बजे';
}

async function loadData() {
  setDate();
  try {
    var res = await fetch('/mummy/data');
    var d = await res.json();

    // Money
    document.getElementById('cash-in').textContent = fmt(d.cash_in);
    document.getElementById('upi-in').textContent  = fmt(d.upi_in);
    document.getElementById('total-income').textContent = fmt(d.total_in);

    // Expenses
    var expEl = document.getElementById('expense-list');
    if (d.expenses.length === 0) {
      expEl.innerHTML = '<div class="empty">आज कोई खर्चा नहीं</div>';
      document.getElementById('net-box').style.display = 'none';
    } else {
      expEl.innerHTML = d.expenses.map(function(e) {
        return '<div class="expense-row"><span class="expense-name">' + e.note + '</span><span class="expense-amt">−₹' + fmt(e.amount) + '</span></div>';
      }).join('');
      var net = d.total_in - d.total_expense;
      var netEl = document.getElementById('net-val');
      netEl.textContent = (net >= 0 ? '+' : '') + '₹' + fmt(Math.abs(net));
      netEl.className = 'net-val ' + (net >= 0 ? 'net-positive' : 'net-negative');
      document.getElementById('net-box').style.display = 'flex';
    }

    // Today's orders
    var ordEl = document.getElementById('order-list');
    document.getElementById('order-count').textContent = d.orders.length;
    if (d.orders.length === 0) {
      ordEl.innerHTML = '<div class="empty">आज कोई नया ऑर्डर नहीं</div>';
    } else {
      ordEl.innerHTML = d.orders.map(function(o) {
        var st = o.status === 'pending' ? '<span class="order-status status-pending">बाकी है</span>'
               : o.status === 'ready'   ? '<span class="order-status status-ready">तैयार</span>'
               : '<span class="order-status status-delivered">मिल गया</span>';
        return '<div class="order-row"><div class="order-num">#' + o.order_code + '</div>'
             + '<div class="order-info"><div class="order-name">' + o.name + '</div>'
             + '<div class="order-garments">' + (o.garments || '') + '</div></div>' + st + '</div>';
      }).join('');
    }

    // Delivered today
    var delEl = document.getElementById('del-list');
    document.getElementById('del-count').textContent = d.delivered.length;
    if (d.delivered.length === 0) {
      delEl.innerHTML = '<div class="empty">आज कोई डिलीवरी नहीं</div>';
    } else {
      delEl.innerHTML = d.delivered.map(function(o) {
        return '<div class="order-row"><div class="order-num">#' + o.order_code + '</div>'
             + '<div class="order-info"><div class="order-name">' + o.name + '</div>'
             + '<div class="order-garments">' + (o.garments || '') + '</div></div>'
             + '<span class="order-status status-delivered">✅ मिला</span></div>';
      }).join('');
    }
  } catch(e) {
    console.error(e);
  }
}

loadData();
setInterval(loadData, 60000); // Auto refresh every minute
</script>
</body>
</html>
