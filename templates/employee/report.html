<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>रिपोर्ट — उत्तम टेलर्स</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f1f5f9;min-height:100vh;color:#1e293b;}

.header{
  background:linear-gradient(135deg,#4338ca,#6366f1,#818cf8);
  padding:28px 20px 24px;text-align:center;
}
.shop-name{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#c7d2fe;margin-bottom:6px;}
.header h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:10px;}
.date-chip{display:inline-block;background:rgba(255,255,255,0.25);border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700;color:#fff;}
.time-small{font-size:12px;color:#c7d2fe;margin-top:6px;}

.content{padding:16px;}

/* Net profit */
.net-hero{
  border-radius:20px;padding:22px;text-align:center;margin-bottom:14px;
}
.net-hero.profit{background:linear-gradient(135deg,#bbf7d0,#86efac);border:2px solid #4ade80;}
.net-hero.loss  {background:linear-gradient(135deg,#fecaca,#fca5a5);border:2px solid #f87171;}
.net-hero .label{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#064e3b;margin-bottom:4px;}
.net-hero.loss .label{color:#7f1d1d;}
.net-hero .amount{font-size:42px;font-weight:900;color:#14532d;}
.net-hero.loss .amount{color:#7f1d1d;}
.net-hero .sub{font-size:13px;font-weight:700;margin-top:6px;color:#15803d;}
.net-hero.loss .sub{color:#b91c1c;}

/* 2 col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}

.income-card{background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:16px;text-align:center;}
.income-card .icon{font-size:22px;margin-bottom:4px;}
.income-card .lbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#15803d;margin-bottom:4px;}
.income-card .amt{font-size:24px;font-weight:900;color:#166534;}

.expense-card{background:#fff1f2;border:2px solid #fca5a5;border-radius:16px;padding:16px;text-align:center;}
.expense-card .icon{font-size:22px;margin-bottom:4px;}
.expense-card .lbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#b91c1c;margin-bottom:4px;}
.expense-card .amt{font-size:24px;font-weight:900;color:#991b1b;}

/* Cards */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.card-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:#f1f5f9;}

/* Income breakdown */
.break-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f8fafc;}
.break-row:last-child{border-bottom:none;}
.break-left{display:flex;align-items:center;gap:10px;}
.break-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.cash-icon{background:#dcfce7;}
.upi-icon{background:#ede9fe;}
.break-name{font-size:15px;font-weight:700;color:#374151;}
.break-sub{font-size:11px;color:#94a3b8;}
.break-amt{font-size:18px;font-weight:900;color:#16a34a;}
.break-amt.upi{color:#7c3aed;}

/* Expenses */
.exp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f8fafc;}
.exp-row:last-child{border-bottom:none;}
.exp-left{display:flex;align-items:center;gap:8px;}
.exp-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0;}
.exp-name{font-size:14px;font-weight:600;color:#374151;}
.exp-amt{font-size:15px;font-weight:800;color:#dc2626;}

/* Orders */
.order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc;}
.order-row:last-child{border-bottom:none;}
.order-code{background:#eef2ff;color:#4338ca;font-size:12px;font-weight:900;padding:4px 8px;border-radius:8px;min-width:48px;text-align:center;}
.order-info{flex:1;}
.order-name{font-size:15px;font-weight:700;color:#1e293b;}
.order-garment{font-size:11px;color:#94a3b8;margin-top:1px;}
.badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;}
.badge-pending  {background:#fef3c7;color:#92400e;}
.badge-ready    {background:#d1fae5;color:#065f46;}
.badge-delivered{background:#ede9fe;color:#5b21b6;}

.empty-msg{text-align:center;padding:18px;color:#94a3b8;font-size:14px;}
.count-chip{background:#f1f5f9;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;color:#64748b;margin-left:auto;}

.refresh-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#4338ca,#6366f1);
  color:#fff;border:none;border-radius:16px;
  font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 16px rgba(99,102,241,0.25);
  margin-bottom:24px;
}
.refresh-btn:active{transform:scale(0.98);}
</style>
</head>
<body>

<div class="header">
  <div class="shop-name">उत्तम टेलर्स — सीकर</div>
  <h1>📊 आज की रिपोर्ट</h1>
  <div class="date-chip" id="today-date">—</div>
  <div class="time-small" id="now-time"></div>
</div>

<div class="content">

  <div class="net-hero profit" id="net-hero">
    <div class="label">आज की कमाई</div>
    <div class="amount">₹<span id="net-amount">—</span></div>
    <div class="sub" id="net-sub"></div>
  </div>

  <div class="two-col">
    <div class="income-card">
      <div class="icon">📈</div>
      <div class="lbl">कुल आमदनी</div>
      <div class="amt">₹<span id="gross-in">—</span></div>
    </div>
    <div class="expense-card">
      <div class="icon">📉</div>
      <div class="lbl">कुल खर्चा</div>
      <div class="amt">₹<span id="total-exp">—</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">💵 आमदनी का हिसाब</div>
    <div class="break-row">
      <div class="break-left">
        <span class="break-icon cash-icon">💵</span>
        <div><div class="break-name">नकद</div><div class="break-sub">Cash in hand</div></div>
      </div>
      <div class="break-amt">₹<span id="cash-in">—</span></div>
    </div>
    <div class="break-row">
      <div class="break-left">
        <span class="break-icon upi-icon">📱</span>
        <div><div class="break-name">UPI / बैंक</div><div class="break-sub">Online payment</div></div>
      </div>
      <div class="break-amt upi">₹<span id="upi-in">—</span></div>
    </div>
  </div>

  <div class="card" style="border-left:4px solid #ef4444;">
    <div class="card-title" style="color:#dc2626;">🔴 आज के खर्चे</div>
    <div id="expense-list"><div class="empty-msg">आज कोई खर्चा नहीं ✅</div></div>
  </div>

  <div class="card">
    <div class="card-title">
      🧵 आज के ऑर्डर
      <span class="count-chip" id="order-count">0</span>
    </div>
    <div id="order-list"><div class="empty-msg">लोड हो रहा है...</div></div>
  </div>

  <div class="card" style="border-left:4px solid #22c55e;">
    <div class="card-title" style="color:#16a34a;">
      ✅ आज डिलीवर हुए
      <span class="count-chip" id="del-count">0</span>
    </div>
    <div id="del-list"><div class="empty-msg">लोड हो रहा है...</div></div>
  </div>

  <button class="refresh-btn" onclick="loadData()">🔄 ताज़ा करें</button>
  <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:-16px;margin-bottom:24px;">आखिरी बार: <span id="last-updated">—</span></div>
</div>

<script>
function fmt(n){return Math.round(n||0).toLocaleString('en-IN');}
function setDate(){
  var now=new Date();
  var days=['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
  var months=['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
  document.getElementById('today-date').textContent=days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
  var h=now.getHours(),m=now.getMinutes();
  document.getElementById('now-time').textContent=(h>=12?'शाम':'सुबह')+' '+(h%12||12)+':'+(m<10?'0'+m:m)+' बजे';
}
async function loadData(){
  setDate();
  try{
    var d=await(await fetch('/mummy/data')).json();
    document.getElementById('gross-in').textContent=fmt(d.total_in);
    document.getElementById('total-exp').textContent=fmt(d.total_expense);
    document.getElementById('cash-in').textContent=fmt(d.cash_in);
    document.getElementById('upi-in').textContent=fmt(d.upi_in);
    var net=d.total_in-d.total_expense;
    document.getElementById('net-amount').textContent=fmt(Math.abs(net));
    var hero=document.getElementById('net-hero');
    if(net>=0){
      hero.className='net-hero profit';
      document.getElementById('net-sub').textContent='मुनाफा 🎉';
    }else{
      hero.className='net-hero loss';
      document.getElementById('net-sub').textContent='खर्चा ज़्यादा है ⚠️';
    }
    var expEl=document.getElementById('expense-list');
    expEl.innerHTML=d.expenses.length?d.expenses.map(function(e){
      return '<div class="exp-row"><div class="exp-left"><span class="exp-dot"></span><span class="exp-name">'+(e.note||'खर्चा')+'</span></div><span class="exp-amt">−₹'+fmt(e.amount)+'</span></div>';
    }).join(''):'<div class="empty-msg">आज कोई खर्चा नहीं ✅</div>';
    var ordEl=document.getElementById('order-list');
    document.getElementById('order-count').textContent=d.orders.length;
    ordEl.innerHTML=d.orders.length?d.orders.map(function(o){
      var b=o.status==='ready'?'<span class="badge badge-ready">तैयार ✓</span>':o.status==='delivered'?'<span class="badge badge-delivered">मिल गया</span>':'<span class="badge badge-pending">बाकी है</span>';
      return '<div class="order-row"><div class="order-code">#'+o.order_code+'</div><div class="order-info"><div class="order-name">'+o.name+'</div><div class="order-garment">'+(o.garments||'')+'</div></div>'+b+'</div>';
    }).join(''):'<div class="empty-msg">आज कोई ऑर्डर नहीं</div>';
    var delEl=document.getElementById('del-list');
    document.getElementById('del-count').textContent=d.delivered.length;
    delEl.innerHTML=d.delivered.length?d.delivered.map(function(o){
      return '<div class="order-row"><div class="order-code">#'+o.order_code+'</div><div class="order-info"><div class="order-name">'+o.name+'</div><div class="order-garment">'+(o.garments||'')+'</div></div><span class="badge badge-delivered">✅ मिला</span></div>';
    }).join(''):'<div class="empty-msg">आज कोई डिलीवरी नहीं</div>';
  }catch(e){console.error(e);}
  try{
  var now=new Date();
  var h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  document.getElementById('last-updated').textContent=(h%12||12)+':'+(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+(h>=12?' शाम':' सुबह');
}
loadData();
setInterval(loadData, 5000);  // every 5 seconds
</script>
</body>
</html>
