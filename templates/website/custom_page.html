{% extends "website/base.html" %}
{% block title %}{{ page.title }} — Uttam Tailors{% endblock %}
{% block content %}
<div style="max-width:860px;margin:0 auto;padding:140px 2rem 5rem;">
  <h1 style="font-family:var(--fd);font-size:42px;font-weight:300;color:var(--dark);margin-bottom:2rem;">{{ page.title }}</h1>
  <div style="font-size:15px;color:var(--muted);line-height:1.8;">{{ page.content | replace('\n','<br>') | safe }}</div>
</div>
{% endblock %}
