name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy via SSH
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /home/ubuntu/UTMS
            git pull origin main || true
            sudo systemctl reset-failed utms || true
            sudo pkill -9 -f gunicorn || true
            sleep 2
            sudo systemctl restart utms
            sleep 5
            if sudo systemctl is-active --quiet utms; then
              echo UTMS_OK
            else
              echo UTMS_FAILED - attempting reboot
              sudo reboot
            fi
          " || true
      - name: Wait after possible reboot
        run: sleep 30
      - name: Re-deploy after reboot
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            sudo systemctl start utms || true
            sleep 3
            sudo systemctl is-active utms && echo FINAL_OK || echo FINAL_FAIL
          " || true
