name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # NOTE: this step intentionally has NO continue-on-error and the remote
      # script uses `set -e` — if git fetch/reset or the service restart fails,
      # this step (and therefore the whole run) will genuinely show red.
      # Previously every command here was wrapped in `|| true` and the job had
      # continue-on-error: true, so this workflow reported "success" in the
      # GitHub API no matter what actually happened on the server (including
      # git pull failing outright, or the SSH connection never landing) —
      # that is why deployed fixes sometimes silently never reached the server.
      - name: Deploy (fetch + hard reset + restart)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            exec > >(tee /home/ubuntu/last_deploy.log) 2>&1
            echo "=== Deploy started: $(date) ==="
            cd /home/ubuntu/UTMS
            echo "BEFORE: $(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard origin/main
            echo "AFTER:  $(git rev-parse HEAD)"
            sudo systemctl reset-failed utms || true
            # systemctl kill is scoped to the utms unit cgroup only — safe.
            # (pkill -f with a path/name pattern matched this deploy script own
            # SSH session cmdline and killed the deploy mid-run; bare pkill -f
            # gunicorn killed the separate website service too.)
            sudo systemctl kill -s SIGKILL utms || true
            sleep 2
            sudo systemctl restart utms
            # Service can take a while to become active on this 1GB box — retry up to 60s.
            for i in $(seq 1 30); do
              if sudo systemctl is-active --quiet utms; then
                echo "UTMS_OK after ${i}x2s"
                exit 0
              fi
              sleep 2
            done
            echo "UTMS did not become active within 60s"
            sudo systemctl status utms --no-pager -l | tail -30
            exit 1
          '

      # Only runs if the deploy step above failed — but now FIRST verifies the
      # service is genuinely dead before rebooting. Previously ANY deploy-step
      # failure (e.g. service coming up a few seconds after the check window)
      # triggered a full server reboot, taking BOTH apps down for ~1 min. With
      # frequent pushes this kept the server in a near-constant reboot cycle.
      - name: Recovery — reboot ONLY if service is truly dead
        if: failure()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            sleep 20
            if sudo systemctl is-active --quiet utms; then
              echo "Service recovered on its own — NO reboot needed"
              exit 0
            fi
            sudo systemctl restart utms || true
            sleep 15
            if sudo systemctl is-active --quiet utms; then
              echo "Service up after one more restart — NO reboot needed"
              exit 0
            fi
            echo "Service genuinely dead — rebooting as last resort"
            sudo reboot
          ' || true

      - name: Wait after recovery reboot
        if: failure()
        run: sleep 30

      - name: Re-verify after reboot
        if: failure()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            sudo systemctl start utms || true
            sleep 3
            sudo systemctl is-active utms && echo FINAL_OK || echo FINAL_FAIL
          '
