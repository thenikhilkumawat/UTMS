name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy via SSH
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /home/ubuntu/UTMS
            git pull origin main || true
            sudo systemctl reset-failed utms || true
            sudo pkill -f gunicorn || true
            sleep 2
            sudo systemctl restart utms
            sleep 5
            sudo systemctl is-active utms && echo UTMS_RUNNING || echo UTMS_DEAD
            sudo journalctl -u utms -n 30 --no-pager || true
            if grep -q 'auth_basic' /etc/nginx/sites-available/uttamtailors 2>/dev/null; then
              sudo sed -i '/auth_basic/d' /etc/nginx/sites-available/uttamtailors
              sudo nginx -t && sudo systemctl reload nginx || true
            fi
          "
